name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      LLM_PROVIDER: offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Check SQLite can load extensions (needed by sqlite-vec)
        run: python -c "import sqlite3; sqlite3.connect(':memory:').enable_load_extension(True)"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: OpenAPI spec is committed and current
        run: python scripts/export_openapi.py && git diff --exit-code openapi.json

  eval-gate:
    needs: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      LLM_PROVIDER: offline
      EMBEDDER: hash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Offline evaluation gate (leakage, injection, PII, retrieval, citations)
        run: python -m eval.run_eval --gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: backend/eval/results/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Generated API types match the OpenAPI spec
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install PyYAML==6.0.4
      - run: python scripts/validate_manifests.py

  images:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images (not pushed)
        run: |
          docker build -t sales-ai-api:ci backend
          docker build -t sales-ai-web:ci frontend
