apiVersion: apps/v1
kind: Deployment
metadata:
  name: sales-ai-api
  namespace: sales-ai
  labels: {app: sales-ai-api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: sales-ai-api}
  template:
    metadata:
      labels: {app: sales-ai-api}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: sales-ai-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: sales-ai-config}
            - secretRef: {name: sales-ai-secrets, optional: true}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: var, mountPath: /app/var}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: var, emptyDir: {}}   # audit log is per pod here; ship it to central storage in production
        - {name: tmp, emptyDir: {}}
