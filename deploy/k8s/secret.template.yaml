# Template only: do not commit real keys. Create the real Secret with
#   kubectl -n sales-ai create secret generic sales-ai-secrets --from-literal=NVIDIA_API_KEY=...
# or through an external secrets manager. Not listed in kustomization.yaml on purpose.
apiVersion: v1
kind: Secret
metadata:
  name: sales-ai-secrets
  namespace: sales-ai
type: Opaque
stringData:
  NVIDIA_API_KEY: "<set-me>"
  GEMINI_API_KEY: ""
