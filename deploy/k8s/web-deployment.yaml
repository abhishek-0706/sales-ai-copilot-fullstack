apiVersion: apps/v1
kind: Deployment
metadata:
  name: sales-ai-web
  namespace: sales-ai
  labels: {app: sales-ai-web}
spec:
  replicas: 2
  selector:
    matchLabels: {app: sales-ai-web}
  template:
    metadata:
      labels: {app: sales-ai-web}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: sales-ai-web:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: API_UPSTREAM, value: "http://sales-ai-api:8000"}
          readinessProbe:
            httpGet: {path: /, port: http}
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
